# Release-only Windows build, pack, and sign.
#
# Why this exists: SignPath Foundation (free OSS code signing) will only sign
# artifacts built by a verifiable CI system - it will not sign a locally-built
# exe. So the released Windows single-exe is built and packed here, then submitted
# to SignPath for signing. Day-to-day dev and dogfooding stay local (cicd-win.ps1);
# only the release artifact runs through this.
#
# It mirrors the known-good local chain: MSYS2/mingw64 meson+ninja build ->
# stage-native.bash (self-contained bundle) -> pack-portable.ps1 (EVB single exe).
#
# Signing is gated on the SIGNPATH_API_TOKEN secret: until the SignPath project is
# approved and the secret/vars are set, the job still builds and attaches the
# UNSIGNED exe, so it never hard-fails on a missing cert. See cicd/win/signing.md
# for the one-time SignPath setup (and note the signed publisher shows as
# "SignPath Foundation", not the project).
#
# Triggers: a pushed v* tag (the release cut), or a manual run for a build/pack
# smoke without releasing.

name: release-win

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # attach assets to the GitHub Release
  id-token: write   # SignPath origin verification (OIDC)

jobs:
  build-sign-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSYS2 mingw64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-libexif
            mingw-w64-x86_64-libgsf
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-desktop-file-utils
            intltool

      - name: Build (meson + ninja)
        shell: msys2 {0}
        run: |
          meson setup -Dxmp=false build source
          ninja -C build

      - name: Stage self-contained runtime bundle
        shell: msys2 {0}
        run: bash cicd/win/stage-native.bash build cicd/artifacts/win-run

      - name: Pack single exe (Enigma Virtual Box)
        shell: pwsh
        run: |
          # The community feed hands out a 503 often enough to lose a release cut
          # on its own, so the install gets a few tries before the job gives up.
          $PSNativeCommandUseErrorActionPreference = $false
          $installed = $false
          foreach ($try in 1..3) {
            choco install enigmavirtualbox --ignore-checksums -y --no-progress
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            Write-Host "choco install failed on attempt $try"
            Start-Sleep -Seconds (20 * $try)
          }
          if (-not $installed) { throw "could not install Enigma Virtual Box" }
          pwsh -File cicd/win/pack-portable.ps1
          if (-not (Test-Path cicd/artifacts/win-portable/nemo-anywhere.exe)) {
            throw "pack produced no exe"
          }

      - name: Upload unsigned exe (build artifact + input to signing)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: nemo-anywhere-win64-unsigned
          path: cicd/artifacts/win-portable/nemo-anywhere.exe
          if-no-files-found: error

      # Submit the built exe to SignPath. Skipped (leaving the exe unsigned) until
      # SIGNPATH_API_TOKEN is set, so an unconfigured repo still produces a build.
      # Input names track the action's README - re-check them at setup time.
      - name: Sign with SignPath
        id: sign
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: nemo-anywhere
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # Notes come from the changelog section for this version. Writes nothing when
      # the version has no section, and the publish step then falls back to the
      # generated commit list rather than an empty body.
      - name: Release notes from changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash cicd/utility/changelog-notes.bash "${GITHUB_REF_NAME}" > release-notes.md || rm -f release-notes.md

      # Attach to the release on a tag build. Prefer the signed exe when present.
      # Creates the release if the tag push arrived before release.bash made one.
      # A SemVer prerelease tag (a hyphen after the version core, e.g. v1.0.0-rc1 or
      # v0.9.0-beta) is marked prerelease; a plain v<version> is marked latest. The
      # flag and the notes are enforced on edit too, so a release that already
      # existed ends up with both right.
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $exe = if (Test-Path signed/nemo-anywhere.exe) { "signed/nemo-anywhere.exe" }
                 else { "cicd/artifacts/win-portable/nemo-anywhere.exe" }
          $rel = if ($env:TAG -match '-') { "--prerelease" } else { "--latest" }
          $notes = "release-notes.md"
          if ((Test-Path $notes) -and (Get-Item $notes).Length -gt 0) {
            gh release create "$env:TAG" --verify-tag --title "$env:TAG" --notes-file $notes $rel 2>$null
            gh release edit "$env:TAG" $rel --notes-file $notes 2>$null
          } else {
            gh release create "$env:TAG" --verify-tag --title "$env:TAG" --generate-notes $rel 2>$null
            gh release edit "$env:TAG" $rel 2>$null
          }
          gh release upload "$env:TAG" "$exe" --clobber
