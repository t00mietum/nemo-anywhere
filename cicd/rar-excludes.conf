## Extra rar excludes for the version backup (utility/n8git_backup-and-publish).
## One pattern per line, without the leading -x. '#' comments and blanks ignored.
## Read from disk, so these apply whether the backup runs as a pipeline stage or
## standalone. Generic excludes (.git, versions, build intermediates, cicd lint,
## profiling, probe and win-run output, backup copies) are built into the script
## itself - only project-specific trees belong here. A root-owned core dump rar
## can't read only warns there now, rather than stopping the publish.
##
## The rule: keep what would hurt to lose, drop what a command regenerates.
## Anything under cicd/artifacts/release is deliberately absent - release builds
## and the packages cut from them are the one thing in artifacts/ worth keeping.
##
## A bare dir pattern drops the dir and all it holds. Adding 'dir/*' as well only
## repeats it, and 'dir/*' alone leaves an empty dir entry behind.

## The cross-built exe (~15MB), copied out by stage 5 on every full run. The zip in
## artifacts/release carries the same exe.
*/cicd/artifacts/cross

## The staged install tree the dogfood stage copies from. The tar.gz, deb and rpm
## in artifacts/release carry the same files.
*/cicd/artifacts/dogfood
